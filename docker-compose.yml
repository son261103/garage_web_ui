# Garage + Garage Web UI — file docker-compose ĐẦY ĐỦ cho server roser.
# Đặt file này tại /opt/garage/docker-compose.yml (cùng thư mục với .env,
# garage.toml, meta/ và data/), code giao diện nằm ở /opt/garage/admin-ui/
# (clone repo này vào đó, xem README mục Cài đặt).
#
# Nếu trên server đã có sẵn service "garage" đang chạy, file này thay thế
# được luôn vì service garage dưới đây giống hệt cấu hình đã chạy trên roser
# (image dxflrs/garage:v2.4.1, S3 :3900, meta/data mount như cũ) — chỉ thêm
# service "admin-ui". Muốn ghép tay thì xem compose-snippet.yml thay vì file này.
#
# Biến môi trường lấy từ file .env trong cùng thư mục (KHÔNG commit .env):
#   GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
# Xem mẫu ở .env.example trong thư mục admin-ui.

services:
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    restart: unless-stopped
    ports:
      - "3900:3900"
    env_file:
      - .env
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data

  admin-ui:
    build: ./admin-ui
    container_name: garage-admin-ui
    restart: unless-stopped
    ports:
      - "3910:8000"
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
      # Điền sau khi đã tạo key S3 (tab Khóa trong giao diện, hoặc CLI).
      # Nếu để trống, tab File hiện hướng dẫn tạo key, các tab khác vẫn chạy.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      - garage
